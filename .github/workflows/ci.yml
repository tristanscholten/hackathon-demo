name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Check formatting
        run: test -z "$(gofmt -l cmd)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/server
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
